[package]
name = "transaction-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
prost = "0.14"
prost-types = "0.14"
ratatui = "0.28"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"
