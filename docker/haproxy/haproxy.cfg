global
    log stdout format raw local0
    maxconn 20000

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 2s

frontend ingress
    bind *:8080
    default_backend go_apps

backend go_apps
    balance roundrobin
    option httpchk GET /api/v1/healthz
    http-check expect status 200
    default-server init-addr libc,none resolvers docker check inter 2s fall 2 rise 1
    server-template app 10 app:8080
